<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <!-- Etiqueta clave para que el diseño sea responsivo en celulares y tablets -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Mi Gestor de Cursos{% endblock %}</title>
        
        <!-- Google Fonts (Inter) para una tipografía más moderna -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        
        <!-- Bootstrap 5.3.3 CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        
        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <style>
            body {
                font-family: 'Inter', sans-serif;
                background-color: #f8f9fa;
            }
            /* Barra de navegación con gradiente moderno */
            .navbar-custom {
                background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            }
            .navbar-brand {
                font-weight: 700;
                letter-spacing: -0.5px;
            }
            .nav-link {
                font-weight: 500;
                transition: all 0.2s ease-in-out;
                border-radius: 0.5rem;
                padding: 0.5rem 0.85rem !important;
                margin: 0 0.15rem;
            }
            .nav-link:hover {
                background-color: rgba(255, 255, 255, 0.1);
                transform: translateY(-1px);
            }
            /* Botón de inicio de sesión */
            .btn-login {
                background-color: #3b82f6;
                border-color: #3b82f6;
                font-weight: 500;
                border-radius: 0.5rem;
                padding: 0.45rem 1.15rem;
                transition: all 0.2s ease;
            }
            .btn-login:hover {
                background-color: #2563eb;
                border-color: #2563eb;
                transform: translateY(-1px);
            }
            /* Mejora sutil para las tarjetas de los templates hijos */
            .card {
                border: none;
                border-radius: 0.75rem;
            }
        </style>
    </head>
    <!-- d-flex flex-column min-vh-100 asegura que el footer siempre quede pegado abajo -->
    <body class="d-flex flex-column min-vh-100">
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm sticky-top py-3">
                <div class="container">
                    <!-- Logo / Nombre de la App -->
                    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'index' %}">
                        <i class="bi bi-mortarboard-fill text-primary fs-4"></i>
                        <span>Gestor de Cursos</span>
                    </a>

                    <!-- Botón Hamburguesa para celulares -->
                    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Abrir menú">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <!-- Enlaces de navegación colapsables -->
                    <div class="collapse navbar-collapse" id="navbarMain">
                        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link text-light" href="{% url 'index' %}">
                                    <i class="bi bi-house-door me-1"></i>Inicio
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-light" href="{% url 'cursos' %}">
                                    <i class="bi bi-book me-1"></i>Cursos
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-light" href="{% url 'profesores' %}">
                                    <i class="bi bi-person-workspace me-1"></i>Profesores
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-light" href="{% url 'lista_estudiantes' %}">
                                    <i class="bi bi-people me-1"></i>Estudiantes
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-light" href="{% url 'entregables' %}">
                                    <i class="bi bi-file-earmark-check me-1"></i>Entregables
                                </a>
                            </li>
                        </ul>

                        <!-- Botón de acción a la derecha -->
                        <div class="d-flex">
                            {% if user.is_authenticated %}
                                <span class="navbar-text text-light me-3">
                                    <i class="bi bi-person-circle me-1"></i>{{ user.username }}
                                </span>
                                <a class="btn btn-outline-light btn-login" href="{% url 'logout' %}">
                                    <i class="bi bi-box-arrow-right me-1"></i>Salir
                                </a>
                            {% else %}
                                <a class="btn btn-outline-light btn-login" href="{% url 'login' %}">
                                    <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sesión
                                </a>
                            {% endif %}
                        </div>
                </div>
            </nav>
        </header>

        <!-- Contenido dinámico de cada página -->
        <main class="flex-grow-1 py-4">
            <div class="container">
                {% block content %}
                {% endblock %}
            </div>
        </main>

        <!-- Footer moderno -->
        <!-- Footer moderno centrado -->
        <footer class="bg-white border-top py-4 mt-auto text-center text-muted small">
            <div class="container">
                <i class="bi bi-mortarboard-fill text-primary me-1"></i>
                <strong>Mi Gestor de Cursos</strong> &copy; 2026. Todos los derechos reservados.
            </div>
        </footer>

        <!-- Bootstrap JS Bundle (necesario para que funcione el menú desplegable en celulares) -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
