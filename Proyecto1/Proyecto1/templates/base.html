<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title> {% block title %}Mi Aplicación{% endblock %} </title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body>
        <header>
            <nav class="navbar navbar-light bg-light static-top">
                <div class="container">
                  <a class="navbar-brand" href="{% url 'myapp:index' %}">Inicio</a>
                  <a class="navbar-brand" href="{% url 'myapp:cursos' %}">Cursos</a>
                  <a class="navbar-brand" href="{% url 'myapp:profesores' %}">Profesores</a>

        </header>
        <main>

        </main>
        <footer>
            <p>&copy; 2026 Mi Gestor de Cursos. Todos los derechos reservados.</p>
        </footer>
    </body>
</html>
