{% extends 'base.html' %}
{% block title %} Eliminar Profesor {% endblock  %}
{% block content %}
 <div class="container mt-5 text-center">
    <h2 class="mb-4">¿Seguro que querés eliminarlo/a?</h2>
 
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Si, eliminar</button>
        <a href="{% url 'profesores' %}" class="btn btn-secondary ms-2">Cancelar</a>
    </form>
 </div>
{% endblock  %}
